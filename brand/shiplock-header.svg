<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="ShipLock: AI writes. Humans ship.">
  <defs>
    <linearGradient id="sl-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.6" stop-color="#151236"/>
      <stop offset="1" stop-color="#2B165B"/>
    </linearGradient>
    <radialGradient id="sl-glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7B3FFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7B3FFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sl-lock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9B68FF"/>
      <stop offset="1" stop-color="#7B3FFF"/>
    </linearGradient>
    <linearGradient id="sl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5424D8"/>
      <stop offset="0.58" stop-color="#2B165B"/>
      <stop offset="1" stop-color="#101532"/>
    </linearGradient>
    <linearGradient id="sl-hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF"/>
      <stop offset="1" stop-color="#C5AEFC"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#sl-sky)"/>
  <rect width="1280" height="320" rx="24" fill="url(#sl-glow)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#7B3FFF" stroke-opacity=".35" stroke-width="2"/>

  <!-- mark (from shiplock-mark.svg) -->
  <svg x="72" y="48" width="224" height="224" viewBox="0 0 512 512">
    <rect x="14" y="14" width="484" height="484" rx="104" fill="url(#sl-bg)"/>
    <rect x="23" y="23" width="466" height="466" rx="96" fill="none" stroke="#9B68FF" stroke-opacity=".65" stroke-width="6"/>
    <path d="M220 100 258 82 298 100v40h-78z" fill="#FFF"/>
    <path d="M159 151 222 123l38 17v57h-101z" fill="#F6F1FF"/>
    <path d="M265 140 308 123l62 28v46H265z" fill="#E6D8FF"/>
    <path d="M78 233 256 192l178 41-45 131c-58 31-112 45-133 45s-75-14-133-45L78 233Z" fill="#131535" stroke="url(#sl-hull)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M83 414c52-30 94-32 149-9 45 19 71 18 115-4 36-18 57-20 85-12" stroke="#A065FF" stroke-width="15" fill="none" stroke-linecap="round" opacity=".9"/>
    <path d="M221 278v-23c0-21 16-39 35-39s35 18 35 39v23" stroke="#fff" stroke-width="18" fill="none" stroke-linecap="round"/>
    <rect x="196" y="271" width="120" height="93" rx="18" fill="#E9D9FF" stroke="#fff" stroke-width="6"/>
    <circle cx="256" cy="311" r="12" fill="#241C57"/>
    <path d="M250 320h12l8 22h-28z" fill="#241C57"/>
  </svg>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="336" y="150" font-size="96" font-weight="800" letter-spacing="-2" fill="#FFFFFF">Ship<tspan fill="url(#sl-lock)">Lock</tspan></text>
    <text x="340" y="206" font-size="40" font-weight="700" fill="#FFFFFF">AI writes. <tspan fill="#22E28F">Humans ship.</tspan></text>
    <text x="340" y="250" font-size="22" font-weight="500" fill="#B9B4D6">Verified release control for agent-built pull requests</text>
  </g>

  <!-- flow chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="1000" y="70" width="216" height="38" rx="10" fill="#151A33" stroke="#3B82F6" stroke-opacity=".7"/>
    <text x="1108" y="94" text-anchor="middle" fill="#9CC2FF">x402 &#183; Hedera testnet</text>
    <rect x="1000" y="124" width="216" height="38" rx="10" fill="#151A33" stroke="#7B3FFF" stroke-opacity=".8"/>
    <text x="1108" y="148" text-anchor="middle" fill="#C9B2FF">World ID &#183; approve SHA</text>
    <rect x="1000" y="178" width="216" height="38" rx="10" fill="#0F2A24" stroke="#22E28F" stroke-opacity=".9"/>
    <text x="1108" y="202" text-anchor="middle" fill="#22E28F">SHA-guarded merge</text>
    <path d="M1108 108v16M1108 162v16" stroke="#6B6890" stroke-width="2"/>
  </g>
</svg>
